spring:
  application:
    name: test-code
  # 引入独立配置文件：Twelve Data 接口地址 + 内网业务地址（assistant/center-task），
  # 前缀加 optional: 使文件缺失时不报错
  config:
    import:
      - classpath:application-twelvedata.yml
      - optional:classpath:application-other.yml
  # PostgreSQL 数据源（生产环境请通过环境变量注入）
  datasource:
    url: jdbc:postgresql://${PG_HOST:192.168.6.15}:${PG_PORT:5432}/${PG_DB:zishi_test}
    username: ${PG_USER:comac}
    password: ${PG_PASSWORD:Comac@2025}
    driver-class-name: org.postgresql.Driver

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 数据库下划线列名 ↔ Java 驼峰属性自动映射（td_bar.bar_time ↔ barTime）
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，生产环境关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 默认主键策略：数据库自增；quant 各实体按“主键外部指定”约定，
      # 在 @TableId(type = ASSIGN_ID) 注解级别覆盖（应用侧雪花生成）
      id-type: auto
  # Mapper XML 位置（暂无 XML，约定放这里）
  mapper-locations: classpath*:mapper/**/*.xml

# HttpService 实现选择，可选值（即 bean 名称）：
# jdkHttpServiceImpl / restTemplateHttpServiceImpl / restClientHttpServiceImpl
# 不配置时默认使用 restClientHttpServiceImpl（见 @Qualifier 中的占位符默认值）
http:
  service:
    impl: restClientHttpServiceImpl
  # https 自签名证书时置为 true 跳过证书校验（仅限内网/测试环境，正式环境必须为 false）
  ssl:
    trust-all: false
  # HttpClient 超时分级配置（支持 10s / 500ms 等格式）
  timeout:
    # 连接超时：建立 TCP/TLS 连接的最长时间
    connect: 10s
    # 读超时：发出请求后等待响应数据的最长时间
    read: 30s